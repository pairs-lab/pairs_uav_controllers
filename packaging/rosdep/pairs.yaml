# Local rosdep rules for PAIRS packages not in the public rosdep index (ROS 1 Noetic).
# Lets bloom/rosdep resolve inter-package dependencies to their Debian package names
# during the .deb build.
pairs_msgs:
  ubuntu: [ros-noetic-pairs-msgs]
pairs_lib:
  ubuntu: [ros-noetic-pairs-lib]
pairs_uav_hw_api:
  ubuntu: [ros-noetic-pairs-uav-hw-api]
pairs_uav_managers:
  ubuntu: [ros-noetic-pairs-uav-managers]
pairs_uav_controllers:
  ubuntu: [ros-noetic-pairs-uav-controllers]
# test-only deps (not installed during the .deb build; mapped so bloom can resolve the keys)
pairs_uav_testing:
  ubuntu: [ros-noetic-pairs-uav-testing]
pairs_uav_gazebo_simulation:
  ubuntu: [ros-noetic-pairs-uav-gazebo-simulation]
